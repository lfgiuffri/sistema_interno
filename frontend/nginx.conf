# nginx para la SPA del Sistema Interno: sirve el estático con fallback a index.html
# (rutas del router de Vue) y cachea los assets con hash.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip básico para texto.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre → cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae a index.html (lo resuelve vue-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
